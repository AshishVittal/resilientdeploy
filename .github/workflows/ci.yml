
name: ResilientDeploy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rollback_test:
        description: "Test deployment rollback"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    name: Test, scan, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t resilientdeploy:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resilientdeploy:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          
      - name: Debug GitHub OIDC context
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "OIDC permission: configured in workflow"   
      
      - name: Debug OIDC token claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = token.split('.')[1];
            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString()
            );
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub
            }, null, 2));
    
      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker tag resilientdeploy:${IMAGE_TAG} ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
      
      
      - name: Deploy to EC2 using SSM
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: i-08119269b7a71027d
          IMAGE_URI: 965984381610.dkr.ecr.ap-south-1.amazonaws.com/resilientdeploy:${{ github.sha }}
          ROLLBACK_TEST: ${{ inputs.rollback_test && 'true' || 'false' }}
        run: |
          set -euo pipefail

          cat > remote-deploy.sh <<'REMOTE'
          #!/bin/bash
          set +e

          REGISTRY="965984381610.dkr.ecr.ap-south-1.amazonaws.com"

          PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' resilientdeploy 2>/dev/null)
          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: Cannot identify previous image. Aborting."
            exit 1
          fi

          echo "Previous image: $PREVIOUS_IMAGE"
          echo "New image: $IMAGE_URI"
          echo "Rollback test mode: $ROLLBACK_TEST"

          if ! aws ecr get-login-password --region "$AWS_REGION" |
               docker login --username AWS --password-stdin "$REGISTRY"; then
            echo "ERROR: ECR login failed. Existing app left untouched."
            exit 1
          fi

          if ! docker pull "$IMAGE_URI"; then
            echo "ERROR: Image pull failed. Existing app left untouched."
            exit 1
          fi

          check_health() {
            curl --fail --silent --show-error \
              --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors \
              --max-time 5 http://localhost:8000/health
          }

          check_new_health() {
            if [ "$ROLLBACK_TEST" = "true" ]; then
              # Temporary test: deliberately fail the new deployment check.
              curl --fail --silent --show-error \
                --max-time 5 http://localhost:8000/health-tesr
            else
              curl --fail --silent --show-error \
                --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors \
                --max-time 5 http://localhost:8000/health
            fi
          }

          rollback() {
            echo "Deployment failed. Collecting new container diagnostics:"
            docker logs --tail 30 resilientdeploy 2>&1 || true
            echo "Rolling back to $PREVIOUS_IMAGE"

            docker rm -f resilientdeploy >/dev/null 2>&1 || true

            if ! docker run -d --name resilientdeploy \
                 --restart unless-stopped -p 8000:8000 "$PREVIOUS_IMAGE"; then
              echo "CRITICAL: Previous container could not start."
              exit 2
            fi

            echo "Checking restored application health..."
            if check_health; then
              echo "Rollback successful. Previous app is healthy."

              if [ "$ROLLBACK_TEST" = "true" ]; then
                echo "ROLLBACK_TEST_PASSED: Previous image restored and healthy."
              fi

              # Nonzero tells the deployment step the new deployment failed.
              exit 1
            fi

            echo "CRITICAL: Rollback health check failed."
            docker logs --tail 30 resilientdeploy 2>&1 || true
            exit 2
          }

          if ! docker rm -f resilientdeploy; then
            echo "ERROR: Could not remove old container."
            exit 1
          fi

          if ! docker run -d --name resilientdeploy \
               --restart unless-stopped -p 8000:8000 "$IMAGE_URI"; then
            rollback
          fi

          echo "Waiting for new deployment health check..."
          sleep 5

          if check_new_health; then
            echo "Deployment successful."
            exit 0
          fi

          echo "New deployment health check failed."
          rollback
          REMOTE

          {
            printf 'export IMAGE_URI=%q\n' "$IMAGE_URI"
            printf 'export AWS_REGION=%q\n' "$AWS_REGION"
            printf 'export ROLLBACK_TEST=%q\n' "$ROLLBACK_TEST"
            cat remote-deploy.sh
          } > remote-deploy-with-env.sh
          mv remote-deploy-with-env.sh remote-deploy.sh

          ENCODED_SCRIPT=$(base64 -w0 remote-deploy.sh)
          jq -n --arg encoded "$ENCODED_SCRIPT" \
            '{commands: ["echo " + ($encoded | @sh) + " | base64 -d | bash"]}' \
            > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM deployment command: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            INVOCATION=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || true)

            STATUS=$(printf '%s' "$INVOCATION" |
              jq -r '.Status // "Pending"')

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                printf '%s\n' "$INVOCATION" |
                  jq '{Status, ResponseCode, Output: .StandardOutputContent, Errors: .StandardErrorContent}'

                STDOUT=$(printf '%s' "$INVOCATION" |
                  jq -r '.StandardOutputContent // ""')

                if [ "$ROLLBACK_TEST" = "true" ] &&
                   [[ "$STDOUT" == *"ROLLBACK_TEST_PASSED"* ]]; then
                  echo "Rollback test passed: previous application restored and healthy."
                  exit 0
                fi

                echo "Deployment or rollback failed. Inspect the SSM output above."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM. Check the command status before retrying."
          exit 1

         
      
