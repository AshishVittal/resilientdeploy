
name: ResilientDeploy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    name: Test, scan, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t resilientdeploy:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resilientdeploy:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          
      - name: Debug GitHub OIDC context
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "OIDC permission: configured in workflow"   
      
      - name: Debug OIDC token claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = token.split('.')[1];
            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString()
            );
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub
            }, null, 2));
    
      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker tag resilientdeploy:${IMAGE_TAG} ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
      
      - name: Deploy to EC2 using SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: i-08119269b7a71027d
          IMAGE_URI: 965984381610.dkr.ecr.ap-south-1.amazonaws.com/resilientdeploy:${{ github.sha }}
        run: |
          cat > remote-deploy.sh <<'REMOTE'
          #!/bin/bash
          set +e

          REGISTRY="965984381610.dkr.ecr.ap-south-1.amazonaws.com"

          PREVIOUS_IMAGE=$(docker inspect --format '{{.Config.Image}}' resilientdeploy 2>/dev/null)
          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: Cannot identify the current image. Leaving deployment untouched."
            exit 1
          fi
          echo "Previous image: $PREVIOUS_IMAGE"

          if ! aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "$REGISTRY"; then
            echo "ERROR: ECR login failed. Existing container was not stopped."
            exit 1
          fi

          if ! docker pull "$IMAGE_URI"; then
            echo "ERROR: New image pull failed. Existing container was not stopped."
            exit 1
          fi

          rollback() {
            echo "Deployment failed. Rolling back to $PREVIOUS_IMAGE"
            docker rm -f resilientdeploy >/dev/null 2>&1 || true

            if ! docker run -d --name resilientdeploy --restart unless-stopped -p 8000:8000 "$PREVIOUS_IMAGE"; then
              echo "CRITICAL: Could not start the previous image."
              exit 2
            fi

            if curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health; then
              echo "Rollback successful. Previous app is healthy."
              exit 1
            fi

            echo "CRITICAL: Rollback started but health check failed."
            exit 2
          }

          if ! docker rm -f resilientdeploy; then
            echo "ERROR: Could not remove the old container; refusing to deploy."
            exit 1
          fi

          if ! docker run -d --name resilientdeploy --restart unless-stopped -p 8000:8000 "$IMAGE_URI"; then
            rollback
          fi

          if curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health; then
            echo "Deployment successful."
            exit 0
          fi

          rollback
          REMOTE

          ENCODED_SCRIPT=$(base64 -w0 remote-deploy.sh)
          jq -n --arg encoded "$ENCODED_SCRIPT" \
            '{commands: ["echo " + ($encoded | @sh) + " | base64 -d | bash"]}' \
            > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM deployment command: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully!"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1
         
      
